[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "harptab"
version = "0.1.0"
description = "Arrange melodies for ten-hole diatonic harmonica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2"]

[project.optional-dependencies]
musicxml = ["music21>=9,<10"]
audio = ["librosa>=0.10.2,<1", "soundfile>=0.12,<1"]
evaluation = ["librosa>=0.10.2,<1", "soundfile>=0.12,<1", "mir-eval>=0.8,<1"]

[project.scripts]
harptab = "harptab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "hypothesis>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/harptab"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/harptab"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["mido.*", "music21.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy.*", "librosa.*", "soundfile.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not audio'"
markers = ["audio: optional synthesized-audio tests"]
