name: Core
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      separation:
        description: Download Demucs weights and run CPU integration tests
        type: boolean
        default: false
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
  musicxml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra musicxml
      - run: uv run --no-sync pytest tests/ingest/test_musicxml.py
  audio:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra evaluation
      - run: uv run --no-sync pytest -m audio
      - run: uv run --no-sync python -m eval --output eval/results/ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-audio-baseline
          path: eval/results/ci.md
  separation:
    if: github.event_name == 'workflow_dispatch' && inputs.separation
    runs-on: ubuntu-latest
    env:
      HARPTAB_TEST_DEMUCS: '1'
      HARPTAB_DEMUCS_CACHE: .tools/separation-cache
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra separation
      - run: uv run --no-sync pytest tests/transcribe/test_separate.py -m audio
